version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stop-license-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - ./data:/app/data
      - ./backend/static:/app/static:ro
    networks:
      - stop-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:17771/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    container_name: stop-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/windsurf-stop.biomed168.com.conf:/etc/nginx/conf.d/default.conf:ro
      - /var/log/nginx:/var/log/nginx
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - stop-net

networks:
  stop-net:
    driver: bridge

volumes:
  data:
