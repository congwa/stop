version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stop-license-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:17771:17771"
    env_file:
      - ./backend/.env
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:17771/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  data:
