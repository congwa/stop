[package]
name = "stop"
version = "0.1.0"
description = "Stop - AI 对话反馈工具"
authors = ["you"]
edition = "2021"
default-run = "stop"

[lib]
name = "stop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
reqwest = { version = "0.13.1", features = ["blocking", "json"] }
tauri-plugin-dialog = "2.6.0"
base64 = "0.22"
tokio = { version = "1", features = ["rt"] }

[[bin]]
name = "windsurf_chat"
path = "src/bin/windsurf_chat.rs"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
