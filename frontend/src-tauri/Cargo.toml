[package]
name = "stop"
version = "0.8.4"
description = "Stop - AI 对话反馈工具"
authors = ["you"]
edition = "2021"
default-run = "stop"
autobins = false

[[bin]]
name = "stop"
path = "src/main.rs"

[lib]
name = "stop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
reqwest = { version = "0.13.1", features = ["blocking", "json"] }
tauri-plugin-dialog = "2.6.0"
base64 = "0.22"
tokio = { version = "1", features = ["rt"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# 快速打包 profile：多核并行，无 LTO，编译速度比 release 快 3-5x
# 使用方式：tauri build --profile release-fast
[profile.release-fast]
inherits = "release"
codegen-units = 18   # 与 CPU 核数对齐
lto = "thin"         # thin LTO 可并行，比 fat LTO 快很多
opt-level = 2        # 比 "s" 更激进的速度优化
strip = true
