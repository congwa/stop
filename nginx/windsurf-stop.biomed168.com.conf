# Rate limiting: 10 req/min per IP for client APIs
limit_req_zone $binary_remote_addr zone=api_client:10m rate=10r/m;
# Stricter limit for activate endpoint: 3 req/min per IP
limit_req_zone $binary_remote_addr zone=api_activate:10m rate=3r/m;

server {
    listen 80;
    server_name windsurf-stop.biomed168.com;

    # --- 禁止访问敏感文件 ---
    location ~ ^/(\.user\.ini|\.htaccess|\.git|\.svn|\.project|LICENSE|README\.md|\.env)$ {
        deny all;
    }

    # --- SSL 证书验证目录 ---
    location ~ /\.well-known {
        allow all;
    }

    # --- 激活接口（严格限流：3次/分钟）---
    location = /api/activate {
        limit_req zone=api_activate burst=2 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:17771;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # --- 客户端 API（限流：10次/分钟）---
    location ^~ /api/ {
        limit_req zone=api_client burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:17771;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # --- Admin 登录（不限流，但有密码保护）---
    location ^~ /admin/auth/ {
        proxy_pass http://backend:17771;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # --- Admin API（JWT 鉴权由后端处理）---
    location ^~ /admin/api/ {
        proxy_pass http://backend:17771;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # --- Admin 前端静态文件（由 FastAPI StaticFiles 托管）---
    location ^~ /admin {
        proxy_pass http://backend:17771;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # HTML 不缓存
        location ~* \.html$ {
            proxy_pass http://backend:17771;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }
        # 带 hash 的 JS/CSS 长期缓存
        location ~* \.[a-f0-9]{8,}\.(css|js)$ {
            proxy_pass http://backend:17771;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }
    }

    # --- 健康检查 ---
    location = /health {
        proxy_pass http://backend:17771/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        access_log off;
    }

    # --- 404 默认返回 ---
    location / {
        return 404;
    }

    # --- 日志 ---
    access_log /var/log/nginx/windsurf-stop.biomed168.com.log;
    error_log /var/log/nginx/windsurf-stop.biomed168.com.error.log;
}
