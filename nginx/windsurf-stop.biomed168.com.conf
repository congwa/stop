# =============================================================================
# windsurf-stop.biomed168.com  vhost config
# 安装说明：
#   1. 将这个文件放入宝塔面板 -> 网站 -> 选择该站 -> 设置 -> 配置文件
#   2. 在 Nginx 主配置（http{}块）中加入 nginx/nginx-http-limit.conf 的内容
#      宝塔路径: 设置 -> 软件设置 -> Nginx -> 配置修改 在 http{} 中添加:
#      limit_req_zone $binary_remote_addr zone=stop_client:10m rate=10r/m;
#      limit_req_zone $binary_remote_addr zone=stop_activate:10m rate=3r/m;
# =============================================================================

server {
    listen 80;
    server_name windsurf-stop.biomed168.com;

    # --- 禁止访问敏感文件 ---
    location ~ ^/(\.user\.ini|\.htaccess|\.git|\.svn|\.project|LICENSE|README\.md|\.env)$ {
        deny all;
    }

    # --- SSL 证书验证目录 ---
    location ~ /\.well-known {
        allow all;
    }

    # --- 健康检查 ---
    location = /health {
        proxy_pass http://127.0.0.1:17771/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        access_log off;
    }

    # --- 激活接口（严格限流：3次/分钟/IP）---
    location = /api/activate {
        limit_req zone=stop_activate burst=2 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:17771;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # --- 客户端 API（限流：10次/分钟/IP）---
    location ^~ /api/ {
        limit_req zone=stop_client burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:17771;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # --- Admin 登录（私鑰换 JWT）---
    location ^~ /admin/auth/ {
        proxy_pass http://127.0.0.1:17771;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # --- Admin API（JWT 鉴权由后端处理）---
    location ^~ /admin/api/ {
        proxy_pass http://127.0.0.1:17771;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # --- Admin 前端静态文件（由 FastAPI StaticFiles 托管）---
    location ^~ /admin {
        proxy_pass http://127.0.0.1:17771;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # --- 默认 404 ---
    location / {
        return 404;
    }

    # --- 日志 ---
    access_log /www/wwwlogs/windsurf-stop.biomed168.com.log;
    error_log /www/wwwlogs/windsurf-stop.biomed168.com.error.log;
}
